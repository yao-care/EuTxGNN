name: Health News Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  actions: write  # 推送後觸發 pages.yml（GITHUB_TOKEN 的 push 不會觸發其他 workflow）

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 lxml pandas

      # Step 1: Ensure keywords.json exists
      - name: Check keywords.json
        run: |
          if [ ! -f data/news/keywords.json ]; then
            echo "Generating keywords..."
            python scripts/generate_news_keywords.py
          fi

      # Step 2: Fetch news from EU sources (parallel)
      - name: Fetch EU news
        run: |
          python scripts/fetchers/eu_news.py &
          python scripts/fetchers/google_news_eu.py &
          wait

      # Step 3: Process and generate pages
      - name: Process news
        run: python scripts/process_news.py

      # Step 4: Commit changes
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Add changed files
          [ -d data/news ] && git add data/news/*.json 2>/dev/null || true
          [ -d docs/_news ] && git add docs/_news/
          [ -f docs/data/news-index.json ] && git add docs/data/news-index.json || true
          [ -f docs/_data/drug_news.json ] && git add docs/_data/drug_news.json || true

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No news updates"
          else
            git commit -m "Update health news $(date +%Y-%m-%d-%H%M)"
            git push
            gh workflow run pages.yml --ref main || echo "Pages dispatch failed"
          fi
