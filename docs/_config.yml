# EuTxGNN - European Drug Repurposing Predictions

# Basic settings
title: "EuTxGNN Drug Repurposing Reports"
description: "EU (EMA) drug repurposing predictions powered by TxGNN"

url: "https://eutxgnn.yao.care"
baseurl: ""
lang: "en"

# Jekyll theme
remote_theme: just-the-docs/just-the-docs

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Search
search_enabled: true
search:
  heading_level: 3

# Footer
footer_content: "Copyright &copy; 2026 藥提醒科技有限公司 (yao.care). For research purposes only. Not medical advice."

# RSS Feed
feed:
  path: feed.xml
  posts_limit: 20

# Collections
collections:
  drugs:
    output: true
    permalink: /drugs/:name/
  news:
    output: true
    permalink: /news/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "drugs"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "news"
    values:
      layout: "default"

# Open Graph
og_image: "/assets/images/og-default.png"

# Twitter Card
twitter:
  card: summary_large_image

# SEO Tag defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  # 2026-11-03：SMART 啟動端點與應用殼（需從 EHR 啟動、沒有可收錄內容）不列入 sitemap；
  # 兩頁本身也有 <meta name="robots" content="noindex">。獨立測試頁 standalone.html 原本照常收錄，
  # 同日用戶決定也改成不收錄、不列入 sitemap（頁面照常可用，只是不進搜尋索引）。
  # ⚠️ 本檔有兩個 defaults: 鍵，YAML 只保留最後這一個（上面 drugs／news 那段實際沒有作用），
  # 所以加在這裡才會生效。
  - scope:
      path: "smart/launch.html"
    values:
      sitemap: false
  - scope:
      path: "smart/app.html"
    values:
      sitemap: false
  - scope:
      path: "smart/standalone.html"
    values:
      sitemap: false

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.template"


